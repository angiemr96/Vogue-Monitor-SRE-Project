apiVersion: apps/v1
kind: Deployment
metadata:
  name: vogue-monitor
  labels:
    app: vogue-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vogue-monitor
  template:
    metadata:
      labels:
        app: vogue-monitor
    spec:
      containers:
        - name: vogue-monitor
          image: vogue-monitor:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

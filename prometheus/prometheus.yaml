global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "vogue_monitor"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["vogue-monitor.default.svc.cluster.local:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter-service:9100"

rule_files:
  - "alert_rules.yaml"

